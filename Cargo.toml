[workspace]
resolver = "3"
members = ["crates/md-codec", "crates/md-cli", "crates/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Unlicense"
repository = "https://github.com/bg002h/descriptor-mnemonic"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
miniscript = { version = "13.0.0", default-features = false, features = ["std"] }
bitcoin = "0.32"
bip39 = "2.2.2"

# PINNED to rust-miniscript master rev ff4732e. Kept by decision 2026-11-03
# (architect miniscript-13-2): no 13.x port; drop when one crates.io release
# carries #910, #915, #911 and #929; the toolkit's miniscript-fork-tripwire
# workflow (toolkit branch `fix/miniscript-tripwire-13-2`) watches for it.
#
# WHY A GIT REV, NOW. crates.io miniscript 13.2.0 (2026-10-17) is the highest
# release. It carries the Display fix this pin was first made for (#953, taptree
# Display flattening; backported as #1039), so that is no longer a reason. The
# pin is required because 13.2.0 lacks the API md-codec calls, verified against
# the 13.2.0 source: no `Terminal::SortedMultiA` (#910; to_miniscript.rs),
# no `Descriptor::derive_at_index` and no `into_definite` (#911; derive.rs), and
# none of #915's `Terminal::SortedMulti` / `WshInner` shapes (descriptor_route.rs).
# #929 has no clean source marker; a drop attempt's build catches it. Dropping
# the patch does not compile.
#
# The original reason, kept for history: #953 fixes `Descriptor`'s Display,
# which FLATTENED a non-caterpillar taptree -- `tr(K,{{pk(A),pk(B)},pk(C)})`
# came out as `tr(K,{{pk(A),pk(B),pk(C)}})`, which Bitcoin Core rejects. md
# derived correct addresses and emitted a descriptor no other wallet could
# parse, which is the "not recoverable with shipped tooling" the DD6 advisory
# named. At the time (2026-08-20) it was in NO release through 13.1.0.
#
# This rev also carries PR #915, which moved `sortedmulti` out of the descriptor
# enums into a miniscript Terminal. That is an INTERNAL cleanup upstream, not a
# standards change: BIP-388 l.138 says `sortedmulti` is valid "inside sh or wsh
# only", BIP-379 does not list it as a Miniscript fragment at all, and #915's own
# body notes it "cannot be decoded into from Script". At this rev upstream
# dispatches it through its generic recursive parser with no depth guard, so
# rust-miniscript is MORE PERMISSIVE than the standard here. md-codec holds the
# BIP rule -- see to_miniscript.rs.
#
# Matches mnemonic-toolkit, which patched to a git rev for the same reason.
[patch.crates-io]
miniscript = { git = "https://github.com/rust-bitcoin/rust-miniscript", rev = "ff4732e5f75aa555682343cb180fa72ee3e8e9d5" }

[profile.test]
opt-level = 2

[profile.dev]
opt-level = 2
