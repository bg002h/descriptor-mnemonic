[package]
name = "md-cli"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the Mnemonic Descriptor (MD) engravable BIP 388 wallet policy backup format"
readme = "README.md"
homepage = "https://github.com/bg002h/descriptor-mnemonic"
documentation = "https://docs.rs/md-cli"
keywords = ["bitcoin", "bip388", "wallet", "descriptor", "bech32"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "md"
path = "src/main.rs"

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]
cli-compiler = ["miniscript/compiler"]

[dependencies]
md-codec = { path = "../md-codec", version = "=0.42.0" }
clap = { version = "4.5", features = ["derive"] }
clap_mangen = "0.3"
libc = "0.2"
anyhow = "1.0"
regex = "1.10"
bitcoin = { workspace = true }
bip39 = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
miniscript = { workspace = true }
# P3 — the shared IO crate, pinned by exact rev.
#
# NOT `path =`: a path does not resolve in a fresh CI checkout, and this repo
# exists at more than one filesystem location on the author's box. NOT
# crates.io: `mnemonic-io-lib` is not published there.
#
# `write_private` is the only item `md` adopts (P3 boundary table, 1 of 11) and
# it is reached as `mnemonic_io_lib::write::write_private` — `write` is a
# `pub mod` with NO root re-export, so the unqualified path is an E0425.
mnemonic-io-lib = { git = "https://github.com/bg002h/mnemonic-engrave", rev = "6c24e62823e6c1ac02aa3862cd6020674bf58544", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.40", features = ["json"] }
tempfile = "3.13"
