# Release: build `md` for every platform the constellation supports, then
# assemble, checksum, (optionally) sign and publish on a tag.
#
# MODELLED ON `mnemonic-engrave/.github/workflows/release.yml`, whose matrix is
# already proven for this exact dependency tree: `me` links md-codec, bitcoin,
# secp256k1 and -- through md-codec's default-on `derive` feature -- miniscript,
# and ships built for all five of these targets today.
#
# WHY A BINARY RELEASE AND NOT crates.io. This workspace pins rust-miniscript to
# a git rev for PR #953 (Descriptor's Display flattens a non-caterpillar
# taptree into one Bitcoin Core rejects). A `[patch.crates-io]` NEVER carries
# into a published crate -- tested: a git dependency fails `cargo publish` with
# "the `git` specification will be removed from the dependency declaration" --
# so crates.io is frozen at md-cli 0.13.0. A binary built HERE has the patch
# applied, so a released binary is correct where a published crate could not be.
# See design/FOLLOWUPS.md, `md-codec-unpublishable-while-patched-to-miniscript-master`.
name: release

on:
  push:
    # Covers this repo's `descriptor-mnemonic-md-cli-v0.14.0` convention as well
    # as a bare `v1.2.3`.
    tags:
      - '*v[0-9]*'
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Never `stable`: matches rust-toolchain.toml and the rest of the constellation.
  RUST_TOOLCHAIN: '1.85.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The constellation's release-signing key. Verification is skipped entirely
  # when MINISIGN_SECRET_KEY is absent, so this workflow works unsigned too.
  MINISIGN_PUBKEY: 'RWQPmgBXsuw5yi8W0SfDr8KF+IqY/Z5U2p724emSODS1UPfJBP3agbKW'

jobs:
  # `assemble` gates its publish on this via `needs:`, so a red suite can never
  # reach a tag release.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: cargo test
        run: cargo test --locked --workspace

  build:
    name: build md (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
        run: cross build --release --locked --target ${{ matrix.target }} -p md-cli

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
        run: cargo build --release --locked --target ${{ matrix.target }} -p md-cli

      - name: Smoke-test the binary
        # Only where the runner can execute what it just built -- a cross build
        # for aarch64 cannot run on an x86_64 runner, and saying so beats a
        # green job that never ran the artifact.
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/md"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version
          # A real round trip, not just --version: encode a template and read it back.
          MD1="$("$BIN" encode 'wpkh(@0/<0;1>/*)' --group-size 0 | grep '^md1')"
          "$BIN" decode "$MD1" | grep -q 'wpkh(@0' || { echo "::error::round trip failed"; exit 1; }
          echo "round trip ok: $MD1"

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/md.exe" "dist/md-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/md" "dist/md-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-${{ matrix.target }}
          path: dist/md-*
          if-no-files-found: error

  assemble:
    name: assemble + sign + release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag + version
        id: meta
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version' crates/md-cli/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Decide whether this release is signed
        id: signing
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY is not set — publishing SHA256SUMS UNSIGNED."
          fi

      - name: Install minisign
        if: steps.signing.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Assemble per-platform archives
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p release

          if [ "$SIGNED" = "true" ]; then
            cat > VERIFY.txt <<EOF
          Verifying this release
          ======================

          1. Verify the checksum file's minisign signature:

               minisign -Vm SHA256SUMS -P ${MINISIGN_PUBKEY}

          2. Verify the binaries against the now-trusted checksums:

               sha256sum -c SHA256SUMS --ignore-missing
          EOF
          else
            cat > VERIFY.txt <<'EOF'
          Verifying this release
          ======================

          This release is NOT signed. Verify the binaries against the checksums:

               sha256sum -c SHA256SUMS --ignore-missing

          A checksum file alone proves integrity, NOT origin.
          EOF
          fi

          pack() {
            local target="$1" a_os="$2" a_arch="$3" ext="$4"
            local stage="stage-${a_os}-${a_arch}"
            mkdir -p "$stage"
            cp "artifacts/md-${target}/md-${target}${ext}" "$stage/md${ext}"
            cp LICENSE VERIFY.txt "$stage/" 2>/dev/null || cp VERIFY.txt "$stage/"
            if [ "$ext" = ".exe" ]; then
              (cd "$stage" && zip -q "../release/md-${TAG}-${a_os}-${a_arch}.zip" ./*)
            else
              chmod +x "$stage/md"
              tar -czf "release/md-${TAG}-${a_os}-${a_arch}.tar.gz" -C "$stage" .
            fi
          }

          pack x86_64-unknown-linux-gnu  linux  amd64 ""
          pack aarch64-unknown-linux-gnu linux  arm64 ""
          pack x86_64-apple-darwin       macos  amd64 ""
          pack aarch64-apple-darwin      macos  arm64 ""
          pack x86_64-pc-windows-msvc    windows amd64 ".exe"

          ls -l release

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum md-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write minisign secret key to a temp file
        if: steps.signing.outputs.enabled == 'true'
        id: minisign_key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEYFILE="$(mktemp)"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEYFILE"
          echo "keyfile=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Sign SHA256SUMS
        if: steps.signing.outputs.enabled == 'true'
        working-directory: release
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
          KEYFILE: ${{ steps.minisign_key.outputs.keyfile }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            minisign -S -s "$KEYFILE" -m SHA256SUMS -t "md ${TAG} SHA256SUMS"
          minisign -Vm SHA256SUMS -P "$MINISIGN_PUBKEY"

      - name: Remove minisign secret key
        if: always()
        env:
          KEYFILE: ${{ steps.minisign_key.outputs.keyfile }}
        run: rm -f "$KEYFILE" || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release/md-*'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/md-*
            release/SHA256SUMS
            release/SHA256SUMS.minisig
          fail_on_unmatched_files: false
